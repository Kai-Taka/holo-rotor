# Hardware
CONFIG_GPIO=y
CONFIG_PWM=y

# Floating point for the ramp math (nRF52840 has an FPU)
CONFIG_FPU=y

# Interactive shell over the USB serial port (COMx on Windows, /dev/ttyACM0 on Linux)
CONFIG_SHELL=y
CONFIG_SHELL_PROMPT_UART="rotor:~$ "
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y

# Board-level USB CDC ACM descriptors
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="holoedu"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="holo-rotor"

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=2048

# printf %f support for the shell status output
CONFIG_CBPRINTF_FP_SUPPORT=y
